<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập | SmartFleet</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">
                <h1>SmartFleet</h1>
                <p>Fleet Management System</p>
            </div>

            <div class="login-heading">
                <h2>Đăng nhập quản trị</h2>
                <p>
                    Đăng nhập để quản lý phương tiện,
                    tài xế và hành trình.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="username"
                        placeholder="admin@smartfleet.local"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                </div>

                <div
                    id="loginError"
                    class="error-message"
                ></div>

                <button
                    id="loginButton"
                    type="submit"
                >
                    Đăng nhập
                </button>

            </form>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='js/login.js') }}"
    ></script>

</body>

</html>
